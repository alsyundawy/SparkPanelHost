name: CI & Security Audit (CWE/CVE Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-security-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Install gosec & govulncheck
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...
      - name: Run gosec SAST
        working-directory: backend
        run: gosec -exclude=G301,G302,G306 -exclude-generated ./...
      - name: Run Go unit tests with race detector
        working-directory: backend
        run: go test -race ./...

  validate-recipes-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/verify_recipes.py
      - run: bash -n installer/install.sh
