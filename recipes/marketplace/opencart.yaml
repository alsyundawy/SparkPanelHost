id: opencart
name: OpenCart
category: marketplace
description:
  id: Sistem toko online ringan dengan dukungan multi-store dan ribuan modul pembayaran.
  en: Lightweight open-source shopping cart with native multi-store management.
version: 4.1.0.4
release_date: '2026-11-21'
upstream:
  provider: github_release
  repo: opencart/opencart
  asset_regex: ^opencart-.*\.zip$
source:
  url: https://github.com/opencart/opencart/releases/download/4.1.0.4/opencart-4.1.0.4.zip
  sha256: cdef537f5a0a7e1b4ddbe16f589dd2e80b10150a09bfbe93ce76ef2d5c3218c0
  strip_components: 1
requirements:
  php_min: '8.3'
  php_recommended: '8.5'
  php_extensions:
  - curl
  - gd
  - intl
  - mbstring
  - mysqli
  - zip
  database: mariadb
  disk_mb: 160
nginx_template: opencart_hardened
waf_profile: ecommerce_crs_exclusions
