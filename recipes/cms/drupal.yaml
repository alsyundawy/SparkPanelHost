id: drupal
name: "Drupal"
category: cms
description:
  id: "Platform CMS modular untuk portal pemerintah, korporasi, dan trafik tinggi."
  en: "Modular digital experience platform built for high-traffic enterprise portals."
version: "11.1.3"
release_date: "2026-10-22"
upstream:
  provider: github_release
  repo: "drupal/drupal"
source:
  url: "https://api.github.com/repos/drupal/drupal/tarball/11.1.3"
  sha256: "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92"
  strip_components: 1
requirements:
  php_min: "8.3"
  php_recommended: "8.5"
  php_extensions:
    - pdo_mysql
    - gd
    - intl
    - mbstring
    - opcache
    - xml
    - zip
  database: mariadb
  disk_mb: 220
nginx_template: "drupal_hardened"
waf_profile: "drupal_crs_exclusions"
