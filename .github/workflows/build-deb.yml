name: Linux Package Builder (.deb)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian/Ubuntu Package (.deb)
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev binutils zstd tar

      - name: Validate Native App Installer Recipes
        run: |
          pip install pyyaml jsonschema
          python3 scripts/verify_recipes.py

      - name: Determine Package Version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(git describe --tags --always 2>/dev/null || echo "0.1.0")"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build Go Static Binaries
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist/bin dist/web dist/packages
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${{ github.sha }} -X main.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o ../dist/bin/panel-agent ./cmd/panel-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${{ github.sha }} -X main.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o ../dist/bin/panel-web ./cmd/panel-web
          cd ..

      - name: Build React 19 Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
          cp -r dist/* ../dist/web/
          cd ..

      - name: Assemble and Build Debian Package (.deb)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          bash scripts/build_deb.sh --version "${VERSION}" --arch amd64 --output dist/packages

      - name: Inspect Package Metadata & File List
        run: |
          for pkg in dist/packages/sparkpanelhost_*.deb; do
            DEB_PKG="${pkg}"
            break
          done
          echo "==> Package Information: ${DEB_PKG}"
          dpkg-deb -I "${DEB_PKG}"
          echo "==> Package File Tree:"
          dpkg-deb -c "${DEB_PKG}" | head -n 35
          echo "==> SHA-256 Checksum:"
          cat dist/packages/*.deb.sha256

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkpanelhost-deb-amd64
          path: |
            dist/packages/*.deb
            dist/packages/*.deb.sha256
          retention-days: 30

  test-deb-install:
    name: Test .deb Clean Install Matrix
    needs: build-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container_image:
          - "ubuntu:24.04"
          - "debian:12"
    container:
      image: ${{ matrix.container_image }}
    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: sparkpanelhost-deb-amd64
          path: pkg

      - name: Test Package Installation
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          for pkg in pkg/sparkpanelhost_*.deb; do
            DEB_FILE="${pkg}"
            break
          done
          apt-get install -y -qq "./${DEB_FILE}"

      - name: Verify Installed Files and Sandbox Structure
        run: |
          test -x /usr/local/bin/panel-agent
          test -x /usr/local/bin/panel-web
          test -L /usr/bin/sparkpanel-agent
          test -L /usr/bin/sparkpanel-web
          test -f /var/panel/web/index.html
          test -f /var/panel/recipes/cms/wordpress.yaml
          test -f /usr/share/sparkpanel/migrations/001_init.sql
          test -f /lib/systemd/system/panel-web.service
          test -f /lib/systemd/system/panel-agent.service
          id -u panel-web
          id -u vmail
          echo "==> File integrity and user verification passed."

  attach-release:
    name: Attach .deb to GitHub Release
    needs: [build-deb, test-deb-install]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: sparkpanelhost-deb-amd64
          path: pkg

      - name: Upload .deb Assets to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/*.deb
            pkg/*.deb.sha256
