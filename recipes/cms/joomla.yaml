id: joomla
name: Joomla!
category: cms
description:
  id: Sistem manajemen konten enterprise dengan kontrol akses ACL bawaan yang kuat.
  en: Flexible enterprise-grade content management system with built-in ACL.
version: 6.2.0
release_date: '2026-11-21'
upstream:
  provider: github_release
  repo: joomla/joomla-cms
  asset_regex: ^Joomla_.*-Stable-Full_Package\.tar\.gz$
source:
  url: https://github.com/joomla/joomla-cms/releases/download/6.2.0/Joomla_6.2.0-Stable-Full_Package.tar.gz
  sha256: f7a4c3962c4a8682f5847ea9d47d2848f6eb475109805935c9e19a5c6511829d
  strip_components: 0
requirements:
  php_min: '8.3'
  php_recommended: '8.5'
  php_extensions:
  - mysqli
  - pdo_mysql
  - curl
  - gd
  - intl
  - mbstring
  - xml
  - zip
  database: mariadb
  disk_mb: 180
nginx_template: joomla_hardened
waf_profile: joomla_crs_exclusions
