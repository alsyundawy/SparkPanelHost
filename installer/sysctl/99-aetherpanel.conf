# AetherPanel v8.1 — Kernel Hardening & High-Concurrency Network Tuning
# Diterapkan pada /etc/sysctl.d/99-aetherpanel.conf

# 1. Anti-Symlink & Hardlink Privilege Escalation (CWE-59)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# 2. Pembatasan ptrace antar-proses tenant (Anti-Snooping)
kernel.yama.ptrace_scope = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# 3. Perlindungan Jaringan & TCP BBR Congestion Control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# 4. Kapasitas Koneksi & File Watcher untuk Hosting Multi-Tenant
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 8192
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
vm.swappiness = 10
