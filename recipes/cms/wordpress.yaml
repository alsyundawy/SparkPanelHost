id: wordpress
name: WordPress
category: cms
description:
  id: Platform CMS & blog open-source terpopuler dengan ekosistem tema dan plugin
    luas.
  en: The world's most popular open-source CMS and publishing platform.
version: 7.1.5
release_date: '2026-11-21'
upstream:
  provider: wordpress_org
  slug: wordpress
source:
  url: https://wordpress.org/wordpress-7.1.5.tar.gz
  sha256: 053857d980eaee8702c617c685948becb9be2523ba0dcbc98e4dbb2300367c79
  strip_components: 1
requirements:
  php_min: '8.2'
  php_recommended: '8.5'
