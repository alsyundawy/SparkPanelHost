name: AetherPanel CI/CD Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-scripts:
    name: Linting & Static Security Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Buf CLI
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint Protobuf Specifications
        working-directory: api/proto
        run: buf lint

      - name: Lint Shell Scripts with ShellCheck
        run: |
          shellcheck -s bash installer/install.sh
          shellcheck -s bash deploy/vagrant/provision-dns-only.sh

      - name: Verify Shell Scripts Syntax
        run: |
          bash -n installer/install.sh
          bash -n deploy/vagrant/provision-dns-only.sh

  backend-tests:
    name: Go Backend Unit Tests & SAST
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Install Security Scanners (gosec & govulncheck)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Dependency Vulnerability Scan (govulncheck)
        working-directory: backend
        run: govulncheck ./...

      - name: Run Static Analysis Security Testing (gosec)
        working-directory: backend
        run: gosec -exclude=G301,G302,G304,G306 -exclude-generated ./...

      - name: Run Backend Unit Tests with Race Detector
        working-directory: backend
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Cross-Compile Static Linux AMD64 Binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/bin/panel-agent ./cmd/panel-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/bin/panel-web ./cmd/panel-web

  frontend-tests:
    name: React 19 Frontend Lint & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: TypeScript Type Checking
        working-directory: frontend
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

  recipes-verification:
    name: Validate Native App Installer Recipes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Schema Validation Tools
        run: pip install pyyaml jsonschema

      - name: Verify Recipes against JSON Schema v7.0
        run: python3 scripts/verify_recipes.py
